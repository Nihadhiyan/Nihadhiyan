<svg width="100%" height="300" viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .node { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #CBD5E1; }
      .tag  { font-family: Consolas, Menlo, monospace; font-size: 9.5px; fill: #64748B; }
      .box  { fill: #0B1220; stroke: #1E3A5F; stroke-width: 1.3; rx: 8; }
    </style>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1100" height="300" fill="#05070C"/>

  <!-- lane labels -->
  <text x="30" y="26" class="tag" letter-spacing="2">EDGE (OFFLINE-CAPABLE)</text>
  <text x="430" y="26" class="tag" letter-spacing="2">SERVICE MESH</text>
  <text x="860" y="26" class="tag" letter-spacing="2">STATE &amp; STREAM</text>

  <!-- EDGE node: Flutter/Isar device -->
  <g transform="translate(30,60)">
    <rect class="box" width="190" height="150"/>
    <text x="16" y="30" class="node" font-weight="700" fill="#7DD3FC">Flutter client</text>
    <text x="16" y="50" class="tag">local-first UI</text>
    <rect x="16" y="66" width="158" height="66" rx="6" fill="#0F1B2E" stroke="#173154"/>
    <text x="26" y="86" class="tag" fill="#94A3B8">Isar DB</text>
    <text x="26" y="102" class="tag" fill="#4ADE80">● writes commit locally</text>
    <text x="26" y="116" class="tag" fill="#FBBF24">◐ queued for sync</text>
    <circle cx="174" cy="20" r="4" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- animated sync packets edge -> mesh -->
  <g>
    <circle r="4" fill="url(#flowGrad)" filter="url(#soft)">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M225,120 C300,120 320,150 420,150"/>
    </circle>
    <circle r="3" fill="#38BDF8">
      <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M225,120 C300,120 320,150 420,150"/>
    </circle>
    <path d="M225,120 C300,120 320,150 420,150" fill="none" stroke="#16283F" stroke-width="1.2"/>
  </g>

  <!-- SERVICE MESH: Go + .NET services around Kafka/Redis + Resilience4j ring -->
  <g transform="translate(420,45)">
    <rect class="box" width="250" height="200"/>
    <text x="18" y="28" class="node" font-weight="700" fill="#93C5FD">Go · .NET services</text>
    <text x="18" y="46" class="tag">circuit-broken by Resilience4j</text>

    <g transform="translate(60,86)">
      <rect x="-46" y="-18" width="92" height="36" rx="6" fill="#0F1B2E" stroke="#22406A"/>
      <text x="0" y="5" text-anchor="middle" class="tag" fill="#7DD3FC">Go svc</text>
    </g>
    <g transform="translate(180,86)">
      <rect x="-46" y="-18" width="92" height="36" rx="6" fill="#0F1B2E" stroke="#22406A"/>
      <text x="0" y="5" text-anchor="middle" class="tag" fill="#C7D2FE">.NET svc</text>
    </g>

    <!-- resilience ring pulsing = health check -->
    <g transform="translate(125,150)">
      <circle r="20" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
      <circle r="20" fill="none" stroke="#4ADE80" stroke-width="2" stroke-dasharray="6 120">
        <animate attributeName="stroke-dashoffset" from="0" to="-126" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="4" text-anchor="middle" class="tag" fill="#4ADE80">R4J</text>
    </g>

    <line x1="60" y1="68" x2="125" y2="132" stroke="#16283F" stroke-width="1.2"/>
    <line x1="180" y1="68" x2="125" y2="132" stroke="#16283F" stroke-width="1.2"/>
  </g>

  <!-- packets mesh -> stream -->
  <g>
    <circle r="4" fill="url(#flowGrad)" filter="url(#soft)">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M670,120 C740,120 760,90 850,90"/>
    </circle>
    <path d="M670,120 C740,120 760,90 850,90" fill="none" stroke="#16283F" stroke-width="1.2"/>
  </g>

  <!-- STATE & STREAM: Kafka + Redis + Postgres -->
  <g transform="translate(850,60)">
    <rect class="box" width="220" height="180"/>
    <g transform="translate(20,30)">
      <rect width="180" height="34" rx="6" fill="#0F1B2E" stroke="#22406A"/>
      <text x="12" y="22" class="tag" fill="#A78BFA">Kafka — event log</text>
      <circle cx="164" cy="17" r="3" fill="#A78BFA">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(20,76)">
      <rect width="180" height="34" rx="6" fill="#0F1B2E" stroke="#22406A"/>
      <text x="12" y="22" class="tag" fill="#F87171">Redis — cache/queue</text>
      <circle cx="164" cy="17" r="3" fill="#F87171">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(20,122)">
      <rect width="180" height="34" rx="6" fill="#0F1B2E" stroke="#22406A"/>
      <text x="12" y="22" class="tag" fill="#7DD3FC">PostgreSQL — system of record</text>
    </g>
  </g>

  <text x="30" y="280" class="tag" fill="#475569">sync resumes automatically once the edge regains a connection — nothing is ever lost in the gap</text>
</svg>
