<svg width="100%" height="330" viewBox="0 0 1100 330" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#060A13"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#A78BFA;#38BDF8;#60A5FA" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#93C5FD">
        <animate attributeName="stop-color" values="#93C5FD;#7DD3FC;#C4B5FD;#93C5FD" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#60A5FA;#22D3EE;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#12203A" stroke-width="1"/>
    </pattern>
    <clipPath id="titleClip">
      <rect x="0" y="-52" width="660" height="70"/>
    </clipPath>
  </defs>

  <rect width="1100" height="330" fill="url(#bg)"/>
  <rect width="1100" height="330" fill="url(#grid)" opacity="0.55"/>

  <rect x="-300" y="0" width="300" height="330" fill="url(#scan)">
    <animate attributeName="x" from="-300" to="1100" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(940,88)">
    <circle r="46" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    <circle r="76" fill="none" stroke="#152A46" stroke-width="1"/>
    <circle r="4.5" fill="#38BDF8" filter="url(#glow)">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M46,0 A46,46 0 1,1 -46,0 A46,46 0 1,1 46,0"/>
    </circle>
    <circle r="3.5" fill="#3B82F6" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M76,0 A76,76 0 1,0 -76,0 A76,76 0 1,0 76,0"/>
    </circle>
    <circle r="5.5" fill="#0F172A" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9" fill="#60A5FA" opacity="0.8">core</text>
  </g>

  <g font-family="Consolas,Menlo,monospace" font-size="10.5" fill="#7DD3FC">
    <line x1="894" y1="88" x2="710" y2="60" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="894" y1="88" x2="710" y2="118" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <g transform="translate(60,120)">
    <text font-family="Consolas,Menlo,monospace" font-size="14" fill="#4B7BAC" letter-spacing="3">
      $ whoami
    </text>
  </g>

  <g transform="translate(60,178)">
    <g clip-path="url(#titleClip)">
      <text font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)"><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.00s" dur="0.5s" fill="freeze"/>M</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.04s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.04s" dur="0.5s" fill="freeze"/>O</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.09s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.09s" dur="0.5s" fill="freeze"/>H</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.14s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.14s" dur="0.5s" fill="freeze"/>A</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.18s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.18s" dur="0.5s" fill="freeze"/>M</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.22s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.22s" dur="0.5s" fill="freeze"/>E</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.27s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.27s" dur="0.5s" fill="freeze"/>D</tspan><tspan dx="14"> </tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.31s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.31s" dur="0.5s" fill="freeze"/>N</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.36s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.36s" dur="0.5s" fill="freeze"/>I</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.40s" dur="0.5s" fill="freeze"/>H</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.45s" dur="0.5s" fill="freeze"/>A</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.49s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.49s" dur="0.5s" fill="freeze"/>D</tspan><tspan opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.54s" dur="0.5s" fill="freeze"/><animate attributeName="dy" values="14;0" begin="0.54s" dur="0.5s" fill="freeze"/>H</tspan></text>

      <rect x="-140" y="-52" width="140" height="70" fill="url(#sheen)">
        <animate attributeName="x" from="-140" to="660" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0" y="14" height="3" fill="#38BDF8" opacity="0.85">
      <animate attributeName="width" from="0" to="620" dur="0.9s" begin="0.05s" fill="freeze"/>
    </rect>
  </g>

  <g transform="translate(60,214)">
    <text font-family="Consolas,Menlo,monospace" font-size="15.5" fill="#94A3B8">
      Focusing on business automation — ERP, TMS, HRM &amp; WMS platforms
    </text>
  </g>

  <g transform="translate(60,240)">
    <text font-family="Consolas,Menlo,monospace" font-size="13.5" fill="#7692B4">
      systems engineer — enterprise backends · offline-first edge · fault-tolerant by design
    </text>
  </g>

  <g transform="translate(60,272)" font-family="Consolas,Menlo,monospace" font-size="12.5" fill="#3FA9F5">
    <text>
      <tspan>uptime:</tspan>
      <tspan fill="#4ADE80" dx="6">always</tspan>
      <tspan dx="18">latency:</tspan>
      <tspan fill="#4ADE80" dx="6">low</tspan>
      <tspan dx="18">network:</tspan>
      <tspan fill="#FBBF24" dx="6">optional</tspan>
    </text>
  </g>

  <rect x="0" y="0" width="1100" height="330" fill="none" stroke="#12203A" stroke-width="1"/>
</svg>
