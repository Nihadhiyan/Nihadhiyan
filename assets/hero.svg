<svg width="100%" height="320" viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#060A13"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#12203A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="320" fill="url(#bg)"/>
  <rect width="1100" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- horizontal data-line sweep -->
  <rect x="-300" y="0" width="300" height="320" fill="url(#scan)">
    <animate attributeName="x" from="-300" to="1100" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- orbiting node system representing distributed services -->
  <g transform="translate(930,90)">
    <circle r="46" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    <circle r="76" fill="none" stroke="#152A46" stroke-width="1"/>
    <circle r="4.5" fill="#38BDF8" filter="url(#glow)">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M46,0 A46,46 0 1,1 -46,0 A46,46 0 1,1 46,0"/>
    </circle>
    <circle r="3.5" fill="#3B82F6" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M76,0 A76,76 0 1,0 -76,0 A76,76 0 1,0 76,0"/>
    </circle>
    <circle r="5.5" fill="#0F172A" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="9" fill="#60A5FA" opacity="0.8">core</text>
  </g>

  <!-- pulse dots labeled as services, connected by animated dashed links -->
  <g font-family="Consolas,Menlo,monospace" font-size="10.5" fill="#7DD3FC">
    <line x1="884" y1="90" x2="700" y2="60" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="884" y1="90" x2="700" y2="120" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="884" y1="90" x2="720" y2="175" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- name block, typewriter-style reveal via clip -->
  <clipPath id="revealName">
    <rect x="0" y="0" width="0" height="80" y2="0">
      <animate attributeName="width" from="0" to="640" dur="1.6s" fill="freeze" begin="0.2s"/>
    </rect>
  </clipPath>

  <g transform="translate(60,130)">
    <text font-family="Consolas,Menlo,monospace" font-size="14" fill="#4B7BAC" letter-spacing="3">
      $ whoami
    </text>
  </g>

  <g transform="translate(60,178)" clip-path="url(#revealName)">
    <text font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="#F472B6" opacity="0.5">
      <animate attributeName="x" values="0;-2;1;0" dur="2.6s" repeatCount="indefinite"/>
      MOHAMED NIHADH
    </text>
    <text font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="#22D3EE" opacity="0.5">
      <animate attributeName="x" values="0;2;-1;0" dur="2.6s" repeatCount="indefinite"/>
      MOHAMED NIHADH
    </text>
    <text font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="url(#titleGrad)" filter="url(#glow)">
      MOHAMED NIHADH
    </text>
  </g>

  <g transform="translate(60,178)">
    <rect width="4" height="46" y="-38" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x" from="0" to="642" dur="1.6s" fill="freeze" begin="0.2s"/>
    </rect>
  </g>

  <g transform="translate(60,214)">
    <text font-family="Consolas,Menlo,monospace" font-size="15.5" fill="#94A3B8">
      systems engineer — distributed backends · offline-first edge · fault-tolerant by design
    </text>
  </g>

  <g transform="translate(60,250)" font-family="Consolas,Menlo,monospace" font-size="12.5" fill="#3FA9F5">
    <text>
      <tspan>uptime:</tspan>
      <tspan fill="#4ADE80" dx="6">always</tspan>
      <tspan dx="18">latency:</tspan>
      <tspan fill="#4ADE80" dx="6">low</tspan>
      <tspan dx="18">network:</tspan>
      <tspan fill="#FBBF24" dx="6">optional</tspan>
    </text>
  </g>

  <rect x="0" y="0" width="1100" height="320" fill="none" stroke="#12203A" stroke-width="1"/>
</svg>
