<svg width="100%" height="380" viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.4"/></filter>
    <style>
      .lbl { font-family: Consolas, Menlo, monospace; font-size: 11px; fill: #CBD5E1; }
      .pct { font-family: Consolas, Menlo, monospace; font-size: 9.5px; fill: #64748B; }
    </style>
  </defs>

  <rect width="1100" height="380" fill="#05070C"/>
  <text x="30" y="34" class="lbl" fill="#64748B" letter-spacing="2">RECENT COMMIT WEIGHT BY LANGUAGE — ORBITAL VIEW</text>

  <g transform="translate(550,205)">
    <circle r="70" fill="url(#coreGlow)" opacity="0.35"/>
    <circle r="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text text-anchor="middle" y="4" class="pct" fill="#38BDF8">you</text>

    <!-- orbit rings -->
    <circle r="80"  fill="none" stroke="#101E33" stroke-width="1"/>
    <circle r="130" fill="none" stroke="#101E33" stroke-width="1"/>
    <circle r="180" fill="none" stroke="#101E33" stroke-width="1"/>

    <!-- Go — largest, closest -->
    <g>
      <circle r="9" fill="#38BDF8" filter="url(#g)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M80,0 A80,80 0 1,1 -80,0 A80,80 0 1,1 80,0"/>
      </circle>
    </g>
    <!-- .NET / C# -->
    <g>
      <circle r="8" fill="#818CF8" filter="url(#g)">
        <animateMotion dur="13s" repeatCount="indefinite" path="M130,0 A130,130 0 1,0 -130,0 A130,130 0 1,0 130,0"/>
      </circle>
    </g>
    <!-- Flutter/Dart -->
    <g>
      <circle r="7.5" fill="#22D3EE" filter="url(#g)">
        <animateMotion dur="11s" repeatCount="indefinite" path="M130,0 A130,130 0 1,1 -130,0 A130,130 0 1,1 130,0" begin="-4s"/>
      </circle>
    </g>
    <!-- TypeScript -->
    <g>
      <circle r="6" fill="#60A5FA" filter="url(#g)">
        <animateMotion dur="17s" repeatCount="indefinite" path="M180,0 A180,180 0 1,0 -180,0 A180,180 0 1,0 180,0"/>
      </circle>
    </g>
    <!-- Kotlin/Java -->
    <g>
      <circle r="5.5" fill="#A78BFA" filter="url(#g)">
        <animateMotion dur="15s" repeatCount="indefinite" path="M180,0 A180,180 0 1,1 -180,0 A180,180 0 1,1 180,0" begin="-6s"/>
      </circle>
    </g>
  </g>

  <!-- legend as descending bars, right side -->
  <g transform="translate(870,70)">
    <text class="lbl" fill="#38BDF8">● Go</text><text x="150" y="0" text-anchor="end" class="pct">core services</text>
    <text y="26" class="lbl" fill="#818CF8">● .NET / C#</text><text x="150" y="26" text-anchor="end" class="pct">enterprise APIs</text>
    <text y="52" class="lbl" fill="#22D3EE">● Flutter / Dart</text><text x="150" y="52" text-anchor="end" class="pct">edge clients</text>
    <text y="78" class="lbl" fill="#60A5FA">● TypeScript</text><text x="150" y="78" text-anchor="end" class="pct">tooling / web</text>
    <text y="104" class="lbl" fill="#A78BFA">● Kotlin / Java</text><text x="150" y="104" text-anchor="end" class="pct">JVM services</text>
  </g>

  <text x="30" y="360" class="pct" fill="#3B4A63">closer orbit = heavier recent use · distance is not a value judgment, just a rhythm</text>
</svg>
