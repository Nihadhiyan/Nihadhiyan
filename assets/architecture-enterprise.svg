<svg width="100%" height="460" viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .node { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #CBD5E1; }
      .tag  { font-family: Consolas, Menlo, monospace; font-size: 9.5px; fill: #64748B; }
      .box  { fill: #0B1220; stroke: #1E3A5F; stroke-width: 1.3; rx: 8; }
      .band { fill: #08101F; stroke: #14233B; stroke-width: 1; rx: 10; }
    </style>
    <linearGradient id="flowGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1100" height="460" fill="#05070C"/>
  <text x="30" y="26" class="tag" letter-spacing="2" fill="#A78BFA">ARCHITECTURE 02 — JAVA / SPRING BOOT ENTERPRISE STACK</text>

  <!-- BAND 1: application + data -->
  <rect class="band" x="20" y="42" width="1060" height="150"/>
  <text x="36" y="60" class="tag" fill="#475569">APPLICATION &amp; DATA</text>

  <!-- React frontend -->
  <g transform="translate(40,74)">
    <rect class="box" width="150" height="94"/>
    <text x="14" y="26" class="node" font-weight="700" fill="#7DD3FC">React</text>
    <text x="14" y="44" class="tag">SPA frontend</text>
    <text x="14" y="60" class="tag">REST / JSON</text>
    <circle cx="132" cy="18" r="4" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Spring Boot services -->
  <g transform="translate(230,74)">
    <rect class="box" width="230" height="94"/>
    <text x="16" y="26" class="node" font-weight="700" fill="#93C5FD">Spring Boot (Java)</text>
    <text x="16" y="44" class="tag">domain services · REST/gRPC</text>
    <g transform="translate(16,54)">
      <rect width="96" height="24" rx="5" fill="#0F1B2E" stroke="#22406A"/>
      <text x="10" y="16" class="tag" fill="#4ADE80">Actuator</text>
    </g>
    <g transform="translate(120,54)">
      <rect width="90" height="24" rx="5" fill="#0F1B2E" stroke="#22406A"/>
      <text x="10" y="16" class="tag" fill="#FBBF24">Security</text>
    </g>
  </g>

  <!-- Kafka / Redis -->
  <g transform="translate(490,74)">
    <rect class="box" width="150" height="44"/>
    <text x="12" y="18" class="node" fill="#A78BFA">Kafka</text>
    <text x="12" y="34" class="tag">event streaming</text>
    <circle cx="132" cy="12" r="3.5" fill="#A78BFA">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(490,124)">
    <rect class="box" width="150" height="44"/>
    <text x="12" y="18" class="node" fill="#F87171">Redis</text>
    <text x="12" y="34" class="tag">cache · session · queue</text>
    <circle cx="132" cy="12" r="3.5" fill="#F87171">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Postgres + Flyway -->
  <g transform="translate(660,74)">
    <rect class="box" width="200" height="94"/>
    <text x="14" y="26" class="node" font-weight="700" fill="#7DD3FC">PostgreSQL</text>
    <text x="14" y="44" class="tag">system of record</text>
    <g transform="translate(14,54)">
      <rect width="90" height="24" rx="5" fill="#0F1B2E" stroke="#22406A"/>
      <text x="10" y="16" class="tag" fill="#60A5FA">Flyway</text>
    </g>
    <text x="112" y="70" class="tag" fill="#64748B">versioned migrations</text>
  </g>

  <!-- ASP.NET side service -->
  <g transform="translate(880,74)">
    <rect class="box" width="180" height="94"/>
    <text x="14" y="26" class="node" font-weight="700" fill="#C7D2FE">ASP.NET (C#)</text>
    <text x="14" y="44" class="tag">auxiliary / legacy-integration</text>
    <text x="14" y="60" class="tag">services</text>
  </g>

  <!-- flow lines band 1 -->
  <g stroke="#16283F" stroke-width="1.2" fill="none">
    <path d="M190,121 L230,121"/>
    <path d="M460,105 L490,96"/>
    <path d="M460,137 L490,146"/>
    <path d="M640,96 L660,105"/>
    <path d="M640,146 L660,137"/>
    <path d="M860,121 L880,121"/>
  </g>
  <circle r="3.5" fill="url(#flowGrad2)" filter="url(#soft2)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M190,121 L230,121 L460,105 L490,96"/>
  </circle>
  <circle r="3.5" fill="url(#flowGrad2)" filter="url(#soft2)">
    <animateMotion dur="2.3s" repeatCount="indefinite" path="M460,146 L640,146 L660,137"/>
  </circle>

  <!-- BAND 2: observability -->
  <rect class="band" x="20" y="204" width="1060" height="120"/>
  <text x="36" y="222" class="tag" fill="#475569">OBSERVABILITY</text>

  <g transform="translate(40,238)">
    <rect class="box" width="150" height="66"/>
    <text x="14" y="24" class="node" fill="#4ADE80">Actuator metrics</text>
    <text x="14" y="42" class="tag">/health /metrics</text>
  </g>
  <g transform="translate(230,238)">
    <rect class="box" width="150" height="66"/>
    <text x="14" y="24" class="node" fill="#FB923C">Prometheus</text>
    <text x="14" y="42" class="tag">scrape &amp; store metrics</text>
  </g>
  <g transform="translate(420,238)">
    <rect class="box" width="150" height="66"/>
    <text x="14" y="24" class="node" fill="#F472B6">Promtail</text>
    <text x="14" y="42" class="tag">log shipping agent</text>
  </g>
  <g transform="translate(610,238)">
    <rect class="box" width="150" height="66"/>
    <text x="14" y="24" class="node" fill="#F472B6">Loki</text>
    <text x="14" y="42" class="tag">log aggregation</text>
  </g>
  <g transform="translate(800,238)">
    <rect class="box" width="240" height="66"/>
    <text x="14" y="24" class="node" font-weight="700" fill="#FBBF24">Grafana</text>
    <text x="14" y="42" class="tag">unified dashboards · alerts</text>
    <circle cx="222" cy="18" r="4" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#16283F" stroke-width="1.2" fill="none">
    <path d="M190,271 L230,271"/>
    <path d="M380,271 L420,271"/>
    <path d="M570,271 L610,271"/>
    <path d="M760,271 L800,271"/>
  </g>
  <circle r="3.5" fill="#FBBF24" filter="url(#soft2)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M190,271 L800,271"/>
  </circle>

  <!-- BAND 3: CI/CD + infra -->
  <rect class="band" x="20" y="338" width="1060" height="104"/>
  <text x="36" y="356" class="tag" fill="#475569">DELIVERY &amp; INFRASTRUCTURE</text>

  <g transform="translate(40,370)">
    <rect class="box" width="170" height="56"/>
    <text x="14" y="22" class="node" fill="#7DD3FC">GitHub Actions</text>
    <text x="14" y="40" class="tag">CI · build · test</text>
  </g>
  <g transform="translate(230,370)">
    <rect class="box" width="150" height="56"/>
    <text x="14" y="22" class="node" fill="#F87171">Jenkins</text>
    <text x="14" y="40" class="tag">deploy pipelines</text>
  </g>
  <g transform="translate(400,370)">
    <rect class="box" width="150" height="56"/>
    <text x="14" y="22" class="node" fill="#A78BFA">Terraform</text>
    <text x="14" y="40" class="tag">infrastructure as code</text>
  </g>
  <g transform="translate(570,370)">
    <rect class="box" width="150" height="56"/>
    <text x="14" y="22" class="node" fill="#FBBF24">AWS</text>
    <text x="14" y="40" class="tag">cloud target</text>
  </g>
  <g transform="translate(740,370)">
    <rect class="box" width="150" height="56"/>
    <text x="14" y="22" class="node" fill="#60A5FA">Azure</text>
    <text x="14" y="40" class="tag">cloud target</text>
  </g>
  <g transform="translate(910,370)">
    <rect class="box" width="170" height="56"/>
    <text x="14" y="22" class="node" font-weight="700" fill="#4ADE80">Production</text>
    <text x="14" y="40" class="tag">live services</text>
    <circle cx="150" cy="16" r="4" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#16283F" stroke-width="1.2" fill="none">
    <path d="M210,398 L230,398"/>
    <path d="M380,398 L400,398"/>
    <path d="M550,398 L570,398"/>
    <path d="M720,398 L740,398"/>
    <path d="M890,398 L910,398"/>
  </g>
  <circle r="3.5" fill="url(#flowGrad2)" filter="url(#soft2)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M210,398 L910,398"/>
  </circle>

  <text x="30" y="452" class="tag" fill="#3B4A63">metrics and logs feed Grafana continuously; every merge rides the same pipeline from commit to cloud</text>
</svg>
