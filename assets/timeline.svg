<svg width="100%" height="260" viewBox="0 0 1100 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .t-lbl { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #CBD5E1; }
      .t-sub { font-family: Consolas, Menlo, monospace; font-size: 10px; fill: #64748B; }
    </style>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="10%" stop-color="#1E3A8A"/>
      <stop offset="90%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="260" fill="#05070C"/>
  <text x="30" y="34" class="t-sub" fill="#64748B" letter-spacing="2">TRAJECTORY</text>

  <line x1="60" y1="130" x2="1040" y2="130" stroke="url(#railGrad)" stroke-width="2"/>

  <!-- traveling pulse along the rail -->
  <circle r="5" fill="#38BDF8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M60,130 L1040,130"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g transform="translate(140,130)">
    <circle r="7" fill="#0B1220" stroke="#38BDF8" stroke-width="2"/>
    <text y="-24" text-anchor="middle" class="t-lbl">Kelaniya · SE undergrad</text>
    <text y="-8" text-anchor="middle" class="t-sub">Dean's List · 3.93 CGPA</text>
    <text y="34" text-anchor="middle" class="t-sub" fill="#4ADE80">foundations</text>
  </g>

  <g transform="translate(400,130)">
    <circle r="7" fill="#0B1220" stroke="#818CF8" stroke-width="2"/>
    <text y="-24" text-anchor="middle" class="t-lbl">wholesale distribution</text>
    <text y="-8" text-anchor="middle" class="t-sub">co-managed, tooling built in-house</text>
    <text y="34" text-anchor="middle" class="t-sub" fill="#4ADE80">operations meets code</text>
  </g>

  <g transform="translate(660,130)">
    <circle r="7" fill="#0B1220" stroke="#22D3EE" stroke-width="2"/>
    <text y="-24" text-anchor="middle" class="t-lbl">offline-first systems</text>
    <text y="-8" text-anchor="middle" class="t-sub">Flutter + Isar, ERP/TMS focus</text>
    <text y="34" text-anchor="middle" class="t-sub" fill="#4ADE80">edge reliability</text>
  </g>

  <g transform="translate(930,130)">
    <circle r="8" fill="#0B1220" stroke="#38BDF8" stroke-width="2.5">
      <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text y="-24" text-anchor="middle" class="t-lbl" fill="#38BDF8">enterprise systems</text>
    <text y="-8" text-anchor="middle" class="t-sub">multi-tenant platforms</text>
    <text y="34" text-anchor="middle" class="t-sub" fill="#FBBF24">in motion</text>
  </g>
</svg>
